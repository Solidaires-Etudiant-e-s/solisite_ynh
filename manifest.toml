packaging_format = 2
id = "solisite"
name = "Solisite"
description.en = "Nuxt 4 website and lightweight CMS for Solidaires Etudiant-e-s, with Prisma-backed MySQL storage"
description.fr = "Site web Nuxt 4 et CMS léger pour Solidaires Étudiant-e-s, avec stockage MySQL piloté par Prisma"

version = "1.4.1~ynh1"

maintainers = ["ebanDev"]

[upstream]
license = "AGPL-3.0"
code = "https://github.com/Solidaires-Etudiant-e-s/solisite"

[integration]
yunohost = ">= 11.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = true
sso = true
disk = "500M"
ram.build = "1G"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.allowed = "visitors"

    admin.url = "/admin"
    admin.show_tile = true
    admin.allowed = ["admins", "commissions"]

    [resources.ports]

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"

    [resources.nodejs]
    version = "24"

    [resources.sources.main]
    url = "https://github.com/Solidaires-Etudiant-e-s/solisite/archive/refs/tags/v1.4.1.tar.gz"
    sha256 = "19beab9156247703b2808fe9f2ccaf3288308467710760387cd9667c439106bc"
    autoupdate.strategy = "latest_github_tag"
